test_credentials: >-
  Not published anonymously. Veradigm's docs state that EHR-launch sandbox testing "requires
  credentials" issued by Veradigm, and standalone testing requires the developer to obtain the
  client organization's FHIR endpoint details directly (or via the Endpoint Directory) and
  communicate testing intent to that client before connecting. No fixed test patient IDs, test
  card numbers, or public sandbox login pairs are published — access is provisioned per developer
  through the Veradigm Connect portal.

test_vs_live_distinction:
  mechanism: separate tenant hostnames/endpoints (sandbox tenants above vs. production client
    endpoints resolved via the Endpoint Directory), not a key-prefix convention.
  key_prefixes: not applicable — Veradigm does not use a Stripe-style test/live key-prefix scheme

