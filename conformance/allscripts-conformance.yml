method: probed
source: >-
  https://fhir.fhirpoint.open.allscripts.com/fhirroute/fhir/CP00101/metadata (live
  CapabilityStatement), https://fhir.fhirpoint.open.allscripts.com/fhirroute/fhir/CP00101/.well-known/smart-configuration
