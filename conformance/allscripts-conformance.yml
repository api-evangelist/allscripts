description: >-
  Standards conformance for the Veradigm FHIR R4 API. The strongest evidence here is not
  documentation prose — it is a live FHIR CapabilityStatement served anonymously by a Veradigm
  Connect sandbox tenant (CP00101) at
  https://fhir.fhirpoint.open.allscripts.com/fhirroute/fhir/CP00101/metadata (HTTP 200,
  application/json+fhir, 59,512 bytes), plus the matching SMART App Launch configuration at the
  same tenant's /.well-known/smart-configuration (HTTP 200, 9,473 bytes). Both were fetched
  unauthenticated on 2026-08-14 and are saved verbatim in this repo. `publisher` is literally
  "Veradigm" and `software.name` is "Veradigm FHIR", confirming the document describes this
  provider's own server, not a third party. No OpenAPI/Swagger document exists anywhere on the
  API host or docs host — every openapi.json/swagger.json/redoc probe against
  open.platform.veradigm.com returned an honest 404, and developer.veradigm.com answers HTTP 200
  with an HTML shell for every path (a soft-404 ASP.NET catch-all, not a real document) — so this
  CapabilityStatement is the only machine-readable contract this provider publishes.
evidence_documents:
